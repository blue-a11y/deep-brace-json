          format('woff2');

      .brand-wordmark,
      .brand-metrics {
        font-family: 'DeepBrace Logo', ui-monospace, monospace;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }
      .brand-symbol {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .brand-slot {
        position: relative;
        display: inline-grid;
        flex-shrink: 0;
      }
      .brand-metrics {
        visibility: hidden;
      }
      .brand-slot > .brand-wordmark {
        position: absolute;
        inset: 0;
      }
      /* 动效等待其他字体时仍显示已就绪的品牌字形。 */
      .brand-wordmark.shuffle-parent {
        visibility: visible;
      }
      @media (min-width: 640px) {
        .brand-wordmark,
        .brand-metrics {
          font-size: 20px;
        }
      }
      /* 骨架与工作区共用结构尺寸，避免字体及响应式初始化推动已显示内容。 */
      :root {
        --startup-background: oklch(0.9702 0 0);
        --startup-foreground: oklch(0.2103 0.0059 285.89);
        --startup-surface: #fff;
        --startup-placeholder: #e8e8eb;
        --startup-muted: #71717a;
        --workspace-toolbar-height: 48px;
        --workspace-tabs-height: 36px;
        /* 状态栏：12.5px 字号 × 1.5 行高 + 上下各 4px。 */
        --workspace-status-height: 26.75px;
      }
      .workspace-toolbar {
        box-sizing: border-box;
        height: var(--workspace-toolbar-height);
      }
      .workspace-tabs {
        box-sizing: border-box;
        flex-shrink: 0;
        height: var(--workspace-tabs-height);
        margin-top: -4px;
        margin-bottom: 12px;
      }
      .workspace-status {
        box-sizing: border-box;
        height: var(--workspace-status-height);
        line-height: 18.75px;
      }
      @media (min-width: 768px) {
        :root {
          --workspace-tabs-height: 33px;
        }
      }
      @media (min-width: 860px) {
        :root {
          --workspace-toolbar-height: 44px;
        }
      }
      .startup-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-sizing: border-box;
        padding: 8px 12px 4px;
        background: var(--startup-background);
        color: var(--startup-foreground);
        font-family: system-ui, sans-serif;
      }
      .startup-toolbar,
      .startup-brand,
      .startup-tools,
      .startup-tabs,
      .startup-pane-heading,
      .startup-message {
        display: flex;
        align-items: center;
      }
      .startup-toolbar {
        flex-shrink: 0;
        justify-content: space-between;
        gap: 20px;
        padding: 0 4px;
      }
      .startup-brand {
        align-items: baseline;
        color: var(--startup-foreground);
        gap: 10px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .startup-logo {
        align-self: center;
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 8px;
        background: var(--startup-foreground);
        color: var(--startup-background);
        font-size: 12px;
        line-height: 16px;
        font-weight: 700;
      }
      .startup-features {
        display: none;
        align-items: center;
        align-self: center;
        flex-shrink: 0;
        gap: 6px;
        margin-left: 4px;
        border-left: 1px solid var(--startup-placeholder);
        padding-left: 12px;
        font-family: var(--font-sans, 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif);
        letter-spacing: normal;
      }
      .startup-feature-placeholder {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 8px;
        border-radius: 9999px;
        background: var(--startup-placeholder);
        color: transparent;
        font-size: 11px;
        font-weight: 500;
        line-height: 24px;
      }
      .startup-feature-placeholder::before {
        content: '';
        width: 12px;
        flex-shrink: 0;
      }
      .startup-feature-placeholder:not(:first-child) {
        display: none;
      }
      @media (min-width: 1280px) {
        .startup-features {
          display: flex;
        }
      }
      @media (min-width: 1536px) {
        .startup-feature-placeholder:not(:first-child) {
          display: flex;
        }
      }
      .startup-placeholder,
      .startup-line,
      .startup-line::before {
        background: var(--startup-placeholder);
        border-radius: 5px;
      }
      .startup-tools {
        gap: 16px;
      }
      .startup-tools span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }
      .startup-tools span:first-child {
        width: 72px;
        border-radius: 14px;
      }
      .startup-tabs {
        gap: 24px;
        padding: 0 4px;
        border-bottom: 1px solid var(--startup-placeholder);
      }
      .startup-body {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }
      .startup-tabs span {
        width: 80px;
        height: 12px;
      }
      .startup-tabs span:last-child {
        width: 60px;
        opacity: 0.6;
      }
      .startup-workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
        gap: 16px;
        padding: 4px;
      }
      .startup-pane {
        overflow: hidden;
        border-radius: 16px;
        background: var(--startup-surface);
      }
      .startup-pane-heading {
        height: 40px;
        justify-content: space-between;
        padding: 0 16px;
      }
      .startup-pane-heading span {
        width: 68px;
        height: 10px;
      }
      .startup-pane-heading span:last-child {
        width: 104px;
        opacity: 0.6;
      }
      .startup-lines {
        display: grid;
        gap: 18px;
        padding: 20px 24px 24px 52px;
      }
      .startup-line {
        position: relative;
        height: 10px;
        width: 65%;
      }
      .startup-line::before {
        content: '';
        position: absolute;
        left: -28px;
        width: 12px;
        height: 8px;
        opacity: 0.5;
      }
      .startup-line:nth-child(3n + 1) {
        width: 38%;
      }
      .startup-line:nth-child(3n + 2) {
        width: 82%;
      }
      .startup-tree .startup-line:nth-child(3n + 2) {
        margin-left: 16px;
        width: 64%;
      }
      .startup-tree .startup-line:nth-child(3n) {
        margin-left: 32px;
        width: 48%;
      }
      .startup-message {
        flex-shrink: 0;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 4px 8px;
        color: var(--startup-muted);
        font-size: 11px;
      }
      .startup-message p {
        margin: 0;
      }
      .startup-message a {
        color: inherit;
        text-underline-offset: 3px;
      }
      @media (max-width: 767px) {
        .startup-workspace {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
          gap: 12px;
          padding: 0;
        }
        .startup-tools span:not(:last-child) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .startup-lines {
          animation: startup-pulse 1.8s ease-in-out infinite alternate;
        }
      }
      @keyframes startup-pulse {
        to {
          opacity: 0.45;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --startup-background: oklch(0.12 0.005 285.823);
          --startup-foreground: oklch(0.9911 0 0);
          --startup-surface: color-mix(in oklab, var(--startup-foreground) 5%, transparent);
          --startup-placeholder: #343438;
          --startup-muted: #a1a1aa;
        }
      }
      :root[data-theme='dark'] {
        --startup-background: oklch(0.12 0.005 285.823);
        --startup-foreground: oklch(0.9911 0 0);
        --startup-surface: color-mix(in oklab, var(--startup-foreground) 5%, transparent);
        --startup-placeholder: #343438;
        --startup-muted: #a1a1aa;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Fira+Code:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Inconsolata:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Noto+Sans+Mono:wght@400;700&family=Red+Hat+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

  <body>
    <div id="root">
      <div class="startup-shell" aria-label="工作区加载状态">
        <div class="startup-toolbar workspace-toolbar" aria-hidden="true">
          <div class="startup-brand">
            <span class="startup-logo brand-symbol">{ }</span>
            <span class="brand-wordmark">DeepBrace JSON</span>
            <div class="startup-features">
              <!-- 隐藏文字仅用于与正式亮点标签保持相同占位宽度。 -->
              <span class="startup-feature-placeholder">大文档优化</span>
              <span class="startup-feature-placeholder">嵌套解析</span>
              <span class="startup-feature-placeholder">数据持久化</span>
              <span class="startup-feature-placeholder">多标签工作区</span>
              <span class="startup-feature-placeholder">JSON5 支持</span>
            </div>
          </div>
          <div class="startup-tools">
            <span class="startup-placeholder"></span>
            <span class="startup-placeholder"></span>
            <span class="startup-placeholder"></span>
            <span class="startup-placeholder"></span>
          </div>
        </div>
        <div class="startup-body">
          <div class="startup-tabs workspace-tabs" aria-hidden="true">
            <span class="startup-placeholder"></span>
            <span class="startup-placeholder"></span>
          </div>
          <div class="startup-workspace" aria-hidden="true">
            <div class="startup-pane" data-workspace-pane="editor">
              <div class="startup-pane-heading">
                <span class="startup-placeholder"></span><span class="startup-placeholder"></span>
              </div>
              <div class="startup-lines">
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
              </div>
            </div>
            <div class="startup-pane startup-tree" data-workspace-pane="preview">
              <div class="startup-pane-heading">
                <span class="startup-placeholder"></span><span class="startup-placeholder"></span>
              </div>
              <div class="startup-lines">
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
                <div class="startup-line"></div>
              </div>
            </div>
          </div>
          <div class="startup-message workspace-status">
            <p role="status">正在加载工作区…</p>
            <a href="">等待过久？重新加载</a>
            <noscript>请启用 JavaScript 后使用 JSON 工作区。</noscript>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
